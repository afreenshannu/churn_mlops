name: ML Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn mlflow fastapi uvicorn pydantic pytest httpx
      - name: Generate data (CI uses synthetic data since real CSV is DVC-tracked)
        run: |
          mkdir -p data/raw data/processed models
          python src/generate_sample_data.py

      - name: Preprocess data
        run: python src/preprocess.py

      - name: Train model
        run: python src/train.py

      - name: Validate model meets quality threshold
        run: python src/evaluate.py

      - name: Run API tests
        run: python -m pytest tests/ -v
        env:
          PYTHONPATH: .

      - name: Build Docker image
        run: docker build -t churn-api:${{ github.sha }} .

      - name: Smoke test Docker container
        run: |
          docker run -d -p 8000:8000 --name churn-test churn-api:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/health || (docker logs churn-test && exit 1)
          docker stop churn-test && docker rm churn-test
